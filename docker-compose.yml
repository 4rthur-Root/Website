services:
  web:
    build: .
    ports: ["5000:5000"]            # host:container
    environment:
      SAMBA_SERVER: ${VM_IP:-10.0.1.10}   # la VM (systemd) :445
      SSH_HOST:      ${VM_IP:-10.0.1.10}   # la VM (systemd) :22
    volumes:
      - admin-audit: /app/backend/audit.log          # bind mount pour les logs d'administrateur
      - sessions: /tmp/flask_sessions_samba          # Sessions web
    restart: unless-stopped

volumes:
  admin-audit:   
  sessions: